<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Buzz — SSH client</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&family=Source+Code+Pro:wght@400;500&family=Fira+Mono:wght@400;500&family=Ubuntu+Mono&family=PT+Mono&display=swap" rel="stylesheet" />

  <!-- Tailwind Play CDN (prototype only) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          borderRadius: { pill: "999px" },
          colors: {
            // DESIGN.md — Linear midnight precision instrument
            void: "#08090a",
            carbon: "#0f1011",
            obsidian: "#161718",
            graphite: "#23252a",
            smoke: "#383b3f",
            ash: "#62666d",
            fog: "#8a8f98",
            mist: "#d0d6e0",
            bone: "#e5e5e6",
            paper: "#ffffff",
            "acid-lime": "#e4f222",
            "pulse-green": "#27a644",
            "coral-red": "#eb5757",
            "signal-teal": "#02b8cc",
            "iris-violet": "#6366f1",
            lavender: "#8b5cf6",
          },
          fontFamily: {
            sans: ['Inter', '"PingFang SC"', '"Noto Sans SC"', '"Microsoft YaHei"', 'ui-sans-serif', 'system-ui', '-apple-system', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'ui-monospace', 'SFMono-Regular', 'Menlo', 'monospace'],
          },
          letterSpacing: {
            tightest: "-0.022em",
            tight: "-0.011em",
          },
        },
      },
    };
  </script>

  <style>
    :root {
      --color-void: #08090a;
      --color-carbon: #0f1011;
      --color-obsidian: #161718;
      --color-graphite: #23252a;
      --color-smoke: #383b3f;
      --color-acid-lime: #e4f222;
      --color-coral-red: #eb5757;
      --color-pulse-green: #27a644;
    }

    html, body, #root {
      height: 100%;
      margin: 0;
      background: var(--color-void);
      color: #d0d6e0;
      font-family: "Inter", "PingFang SC", "Noto Sans SC", "Microsoft YaHei", ui-sans-serif, system-ui, -apple-system, sans-serif;
      font-feature-settings: "cv01" on, "ss03" on, "zero" on;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      overflow: hidden;
    }

    body { min-width: 960px; }

    ::selection { background: rgba(228, 242, 34, 0.22); color: #fff; }

    /* Quick-script undo toast — countdown bar */
    @media (prefers-reduced-motion: no-preference) {
      .qs-toast-bar { animation: qs-toast-bar 5.2s linear forwards; }
    }
    @keyframes qs-toast-bar { from { width: 100%; } to { width: 0%; } }

    .scroll-thin { scrollbar-width: thin; scrollbar-color: #383b3f transparent; }
    .scroll-thin::-webkit-scrollbar { width: 9px; height: 9px; }
    .scroll-thin::-webkit-scrollbar-thumb { background: #2a2c31; border-radius: 9px; border: 2px solid transparent; background-clip: padding-box; }
    .scroll-thin::-webkit-scrollbar-thumb:hover { background: #383b3f; background-clip: padding-box; }
    .scroll-thin::-webkit-scrollbar-track { background: transparent; }

    .term { background: #000; color: #f2f2f2; font-family: "JetBrains Mono", "PingFang SC", "Noto Sans SC", ui-monospace, monospace; font-size: 12.5px; line-height: 1.42; letter-spacing: -0.006em; }
    .c-red { color: #ff6b7a; }
    .c-green { color: #a8e6b5; }
    .c-blue { color: #78b4ff; }
    .c-yellow { color: #f6d59b; }
    .c-cyan { color: #93ddd7; }
    .c-magenta { color: #d46b9b; }
    .c-dim { color: #6c7077; }
    .c-lime { color: #e4f222; }
    .c-white { color: #f2f2f2; }

    @media (prefers-reduced-motion: no-preference) {
      .cursor-blink { animation: term-blink 1.05s steps(1) infinite; }
    }
    @keyframes term-blink { 0%, 50% { opacity: 1; } 50.01%, 100% { opacity: 0; } }

    @media (prefers-reduced-motion: no-preference) {
      .stream-caret::after { content: "▋"; margin-left: 1px; color: var(--color-acid-lime); animation: term-blink 1s steps(1) infinite; }
    }

    @media (prefers-reduced-motion: no-preference) {
      .standby-dot { animation: standby-pulse 2.4s ease-in-out infinite; }
    }
    @keyframes standby-pulse { 0%, 100% { opacity: 0.35; transform: scale(0.85); } 50% { opacity: 1; transform: scale(1); } }

    .spin { animation: spin 0.8s linear infinite; }
    @media (prefers-reduced-motion: reduce) { .spin { animation-duration: 2.4s; } }
    @keyframes spin { to { transform: rotate(360deg); } }

    @media (prefers-reduced-motion: no-preference) {
      .rise-in { animation: rise-in 0.26s cubic-bezier(0.2, 0.7, 0.2, 1); }
    }
    @keyframes rise-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

    @media (prefers-reduced-motion: no-preference) {
      .pop-in { animation: pop-in 0.18s cubic-bezier(0.2, 0.7, 0.2, 1); }
    }
    @keyframes pop-in { from { opacity: 0; transform: translateY(-6px) scale(0.985); } to { opacity: 1; transform: none; } }

    .focus-ring:focus-visible { outline: 2px solid rgba(228, 242, 34, 0.7); outline-offset: 2px; }
  </style>
</head>
<body>
  <div id="root"></div>

  <!-- React + ReactDOM + Babel (pinned, integrity per skill) -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <!-- Prototype sources, in dependency order.
       shell.jsx mounts BuzzApp to #root; do NOT load app.jsx here
       (that is the standalone AI-mode demo, index.html). -->
  <script type="text/babel" src="data.jsx"></script>
  <script type="text/babel" src="inventory.jsx"></script>
  <script type="text/babel" src="chrome.jsx"></script>
  <script type="text/babel" src="quickscripts.jsx"></script>
  <script type="text/babel" src="ai.jsx"></script>
  <script type="text/babel" src="ai-session.jsx"></script>
  <script type="text/babel" src="agent.jsx"></script>
  <script type="text/babel" src="views.jsx"></script>
  <script type="text/babel" src="prefs.jsx"></script>
  <script type="text/babel" src="shell.jsx"></script>
</body>
</html>
